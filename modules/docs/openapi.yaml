openapi: 3.0.3
info:
  title: DocShare module API
  version: "1.0.0"
  description: >
    Module-owned API fragment and source of truth for the DocShare module's HTTP boundary:
    per-file owner/editor/viewer sharing, enforced by authz object-mode checks on every
    read/write, never by the read-side index alone. All paths live under service.basePath
    (/api/docs), with the major version inside the module's own path space (/v1).
servers:
  - url: /api/docs
  # The registry catalog (internal/registry/seed.go
  # HealthPath) and the running mux (mountRoutes: "GET /health"/"GET /ready", no /api/docs
  # prefix) both confirm liveness/readiness probes are hit directly against the module's own
  # host:port, OUTSIDE service.basePath — unlike every other route in this fragment. A second
  # global server entry (rather than a PER-PATH `servers` override on /health and /ready) is
  # deliberate: kin-openapi's gorillamux router (routers/gorillamux/router.go NewRouter) mutates
  # its shared `servers` loop variable in place when ANY path declares its own `servers`
  # override, and 0-variable paths (InMatchingOrder sorts by variable count ascending) are
  # always visited before every other path in this fragment — a per-path override on /health or
  # /ready would silently break route matching for every other operation. A second global entry
  # avoids the bug entirely (this fragment's `/v1/...` paths simply never match under `/`,
  # so nothing is exercised there in practice).
  - url: /
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe. Served on the service's own listener, not under `/api/<module>`.
      responses:
        "200":
          description: OK

  /ready:
    # Served by handleReady (mountRoutes: "GET /ready").
    get:
      operationId: getReady
      summary: Readiness probe (database ping). Served on the service's own listener, not under `/api/<module>`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { status: { type: string } } }
        "503":
          description: Database unreachable (errenv code INTERNAL_ERROR, verbatim from the running handler — not a dedicated unavailable code).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /v1/companies/{companyId}/documents:
    parameters:
      - $ref: "#/components/parameters/companyId"
    get:
      operationId: listDocuments
      summary: Documents the caller may see (owned + shared-with-me, each verified via batch object-check)
      x-required-modules: [docs]
      responses:
        "200":
          description: List of visible documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentListEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
    post:
      operationId: createDocument
      summary: Create a document (docs.create — membership-gated)
      x-required-modules: [docs]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDocumentRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentEnvelope" }
        "200":
          description: Idempotent replay — same Idempotency-Key + same payload as a prior create returns the ORIGINAL document unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }

  /v1/companies/{companyId}/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/companyId"
      - $ref: "#/components/parameters/docId"
    get:
      operationId: getDocument
      summary: Read a document (viewer relation, object-mode check)
      x-required-modules: [docs]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/DocumentEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateDocument
      summary: Update a document's title/body (editor relation, object-mode check)
      x-required-modules: [docs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDocumentRequest" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/DocumentEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteDocument
      summary: Delete a document (owner relation, object-mode check)
      x-required-modules: [docs]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/companies/{companyId}/documents/{docId}/shares:
    parameters:
      - $ref: "#/components/parameters/companyId"
      - $ref: "#/components/parameters/docId"
    get:
      operationId: listShares
      summary: List a document's current shares (viewer relation)
      x-required-modules: [docs]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ShareListEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createShare
      summary: Grant a member viewer or editor access (owner relation); fires a notification event
      x-required-modules: [docs]
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateShareRequest" }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/ShareEnvelope" } } }
        "200":
          description: Idempotent replay — same Idempotency-Key + same payload as a prior share-create returns the ORIGINAL share unchanged.
          content: { application/json: { schema: { $ref: "#/components/schemas/ShareEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /v1/companies/{companyId}/documents/{docId}/shares/{memberId}:
    parameters:
      - $ref: "#/components/parameters/companyId"
      - $ref: "#/components/parameters/docId"
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeShare
      summary: Revoke a member's access (owner relation; owner cannot revoke self); fires a notification event
      x-required-modules: [docs]
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/companies/{companyId}/documents/{docId}/audit:
    parameters:
      - $ref: "#/components/parameters/companyId"
      - $ref: "#/components/parameters/docId"
    get:
      operationId: getDocumentAudit
      summary: This document's audit trail (shares, revokes, edits) — viewer relation
      x-required-modules: [docs]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventListEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/companies/{companyId}/audit:
    parameters:
      - $ref: "#/components/parameters/companyId"
    get:
      operationId: getModuleAudit
      summary: Module-wide audit trail for the admin view (docs.manage) — never shows document content
      x-required-modules: [docs]
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditEventPageEnvelope" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CapabilityOrAuthzError" }

components:
  parameters:
    companyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    docId:
      name: docId
      in: path
      required: true
      schema: { type: string, format: uuid }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }

  schemas:
    Document:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        ownerKcSub: { type: string }
        myRelation: { type: string, enum: [owner, editor, viewer] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateDocumentRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string }
    UpdateDocumentRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string }
    DocumentEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Document" }
    DocumentListEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            owned:
              type: array
              items: { $ref: "#/components/schemas/Document" }
            sharedWithMe:
              type: array
              items: { $ref: "#/components/schemas/Document" }
    Share:
      type: object
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        relation: { type: string, enum: [viewer, editor] }
        grantedBy: { type: string }
        createdAt: { type: string, format: date-time }
    CreateShareRequest:
      type: object
      required: [memberId, relation]
      properties:
        memberId: { type: string, format: uuid }
        relation: { type: string, enum: [viewer, editor] }
    ShareEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Share" }
    ShareListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Share" }
    AuditEvent:
      type: object
      properties:
        occurredAt: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        subject: { type: string }
        payload: {}
    AuditEventListEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
    AuditEventPageEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AuditEvent" }
            total: { type: integer }
            page: { type: integer }
            pageSize: { type: integer }
            totalPages: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

  responses:
    BadRequest:
      description: BAD_REQUEST / VALIDATION_ERROR
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: AUTH_TOKEN_MISSING / AUTH_TOKEN_INVALID
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationFailed:
      description: >
        VALIDATION_FAILED — a domain-policy rejection distinct from ordinary field-shape
        validation. First use: sharing with a member who has no linked user account (422).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    IdempotencyConflict:
      description: >
        IDEMPOTENCY_CONFLICT — the same Idempotency-Key was already used with a different
        request payload.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CapabilityOrAuthzError:
      description: >
        One of the three capability codes (MODULE_NOT_INSTALLED, MODULE_DISABLED,
        MODULE_DEPENDENCY_MISSING — checked in that order by the gateway, before this service is
        ever reached) or this service's own AUTHORIZATION_DENIED (caller lacks the required
        relation on the object, or is not a company member).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
