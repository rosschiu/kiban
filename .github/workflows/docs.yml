# Builds the public documentation site (docs/, MkDocs Material) on every push to main
# and on every pull request, and deploys it to GitHub Pages on a `v*` tag push or a manual
# dispatch. The `build` job runs `make docs-site` (strict mode); the `deploy` job publishes the
# artifact it uploaded.
name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make docs-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site-build

  deploy:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
