# Builds the public documentation site (docs/, MkDocs Material) strictly on every push to main
# and every pull request, and publishes it versioned with mike: a push to main deploys `dev`,
# a `v<major>.<minor>.<patch>` tag deploys `<major>.<minor>` and moves `latest` to it. mike
# commits the built site to the `gh-pages` branch, which GitHub Pages serves; the site root
# redirects to `latest`.
name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make docs-site
      - name: deploy dev (push to main)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          PATH="$PWD/.venv-docs/bin:$PATH" mike deploy --push dev
      - name: deploy the tag's minor as latest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          minor="$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f1,2)"
          export PATH="$PWD/.venv-docs/bin:$PATH"
          mike deploy --push --update-aliases "$minor" latest
          mike set-default --push latest
