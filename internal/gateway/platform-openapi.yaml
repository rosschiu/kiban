                      memberId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GroupExternallyManaged" }
        "503": { $ref: "#/components/responses/AuthorizationUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A Kiban access token: a user's, from a browser login through the gateway's /auth proxy
        (client kiban-frontend, PKCE), or a service client's, from the client-credentials grant
        (KIBAN_SERVICE_CLIENTS). Audience kiban-api, issuer <gateway>/realms/kiban.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

    MfaPolicy:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
        method:
          type: string
          nullable: true
          description: "`otp` (authenticator app), `passkey`, or `otp_or_passkey`; absent when not required."

    MfaPolicyRequest:
      type: object
      required: [required]
      properties:
        required: { type: boolean }
        method:
          type: string
          enum: [otp, passkey, otp_or_passkey]
          description: Required when `required` is true.

    MfaSyncOutcome:
      type: object
      description: One user's sync result.
      properties:
        UserID: { type: string }
        KcSub: { type: string }
        Required: { type: boolean }
        RequiredMode: { type: string, description: "The mode written to Keycloak: `none`, `otp_required`, `passkey_required` or `otp_or_passkey_required`." }
        Success: { type: boolean }
        Error: { type: string }

    PlatformRoleRequest:
      type: object
      required: [subjectId, role]
      properties:
        subjectId: { type: string, description: The subject's Keycloak subject id (kcSub). }
        role: { type: string, enum: [kiban-superadmin] }

    EffectiveAccessObjectRef:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: { type: string }
        id: { type: string }

    EffectiveAccessRequest:
      type: object
      required: [featureKey, scope]
      properties:
        featureKey: { type: string }
        moduleKey: { type: string }
        scope: { type: string, enum: [global, company] }
        companyId: { type: string, format: uuid }
        requiredPlatformRole: { type: string }
        allowPlatformOperatorCompanyScope: { type: boolean }
        requiredCompanyRole: { type: string }
        object: { $ref: "#/components/schemas/EffectiveAccessObjectRef" }
        relation: { type: string }
        requiresEligibility: { type: boolean }
        correlationId: { type: string }

    EffectiveAccessEvidence:
      type: object
      properties:
        key: { type: string }
        value: { type: string }

    EffectiveAccessDecision:
      type: object
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EffectiveAccessEvidence" }

    EffectiveAccessDecisionEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/EffectiveAccessDecision" }

    EffectiveAccessBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            type: object
            required: [object, relation]
            properties:
              object: { $ref: "#/components/schemas/EffectiveAccessObjectRef" }
              relation: { type: string }

    EffectiveAccessBatchEnvelope:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              object: { $ref: "#/components/schemas/EffectiveAccessObjectRef" }
              relation: { type: string }
              decision: { $ref: "#/components/schemas/EffectiveAccessDecision" }

    EffectiveAccessRoleBinding:
      type: object
      properties:
        scope: { type: string, enum: [global, company] }
        role: { type: string }
        companyId: { type: string, format: uuid }

    EffectiveAccessObjectAccessEntry:
      type: object
      properties:
        objectType: { type: string }
        objectId: { type: string }
        relations:
          type: array
          items: { type: string }

    EffectiveAccessSummary:
      type: object
      properties:
        data:
          type: object
          properties:
            apiVersion: { type: integer }
            subjectId: { type: string }
            companyId: { type: string }
            moduleKey: { type: string }
            featureKeys:
              type: array
              items: { type: string }
            roleBindings:
              type: array
              items: { $ref: "#/components/schemas/EffectiveAccessRoleBinding" }
            objectAccess:
              type: array
              items: { $ref: "#/components/schemas/EffectiveAccessObjectAccessEntry" }
            rowScopes: { type: array, items: {} }
            fieldPolicies: { type: array, items: {} }

    AppManifest:
      type: object
      required: [key, displayName, version, serviceClientId, authzFragment]
      properties:
        key: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
        displayName: { type: string }
        version: { type: string }
        serviceClientId: { type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$" }
        features:
          type: array
          items: { type: string }
        authzFragment:
          type: object
          description: The fragment's "relations" section, one entry per object type
          additionalProperties: true
    AuthzGrantsRequest:
      type: object
      required: [op, companyId, tuples]
      description: >
        Every tuple is bound to `companyId`: its object must be an object type declared by one
        enabled module's fragment (anchored to `company_module:<companyId>/<module>`, an anchor
        tuple in the same grant request counts) or `company_module:<companyId>/<module>` itself;
        base types (company, system, module, member, position, group) are refused (422), with
        one exception: a superadmin may grant or revoke `company:<companyId>#admin` for a user,
        which appoints or dismisses an administrator of that company. Otherwise the bearer must
        pass the effective-access decision's steps 1–6 for that (module, company) (403
        otherwise) and, for a `company_module` object, hold its `admin` relation.
      properties:
        op: { type: string, enum: [grant, revoke] }
        companyId: { type: string, format: uuid }
        correlationId: { type: string }
        tuples:
          type: array
          items:
            type: object
            required: [objectType, objectId, relation, subjectType, subjectId]
            properties:
              objectType: { type: string }
              objectId: { type: string }
              relation: { type: string }
              subjectType: { type: string }
              subjectId: { type: string }
              subjectRelation: { type: string }

    OrgMeCompany:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        isActive: { type: boolean }

    MemberDirectoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string }
        hasLinkedUser: { type: boolean }
        kind: { type: string, enum: [person, service], description: "`service` when the linked user is an app's service account" }

    Capability:
      type: object
      properties:
        module: { type: string }
        installed: { type: boolean }
        enabled: { type: boolean }
        dependencies: { type: array, items: { type: string } }
        missingDependencies: { type: array, items: { type: string } }

    CatalogEntry:
      type: object
      properties:
        moduleKey: { type: string }
        displayName: { type: string }
        scopeType: { type: string }
        mandatory: { type: boolean }
        basePath: { type: string }
        healthPath: { type: string }
        port: { type: integer }
        licenseClass: { type: string }
        manifestVersion: { type: string }
        isActive: { type: boolean }

    OrgUnit:
      type: object
      properties:
        id: { type: string, format: uuid }
        typeKey: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        isActive: { type: boolean }
    OrgUnitCreateRequest:
      type: object
      required: [typeKey, code, name]
      properties:
        typeKey: { type: string, description: "\"company\" for a company; a taxonomy key such as \"business_unit\" below it" }
        parentId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
    OrgMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        code: { type: string }
        displayName: { type: string }
        email: { type: string, nullable: true }
        userId: { type: string, nullable: true, description: "The linked identity user, or null" }
        isActive: { type: boolean }
        kind: { type: string, enum: [person, service], description: "`service` when the linked user is an app's service account; `person` otherwise" }
    OrgMemberCreateRequest:
      type: object
      required: [companyId, code, displayName]
      properties:
        companyId: { type: string, format: uuid }
        code: { type: string }
        displayName: { type: string }
        email: { type: string }
    OrgMemberUpdateRequest:
      type: object
      properties:
        displayName: { type: string }
        email: { type: string }
        isActive: { type: boolean }
    OrgPosition:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        orgUnitId: { type: string, format: uuid }

    OrgPositionWithHolder:
      allOf:
        - $ref: "#/components/schemas/OrgPosition"
        - type: object
          properties:
            assignmentId: { type: string, format: uuid, nullable: true }
            memberId: { type: string, format: uuid, nullable: true }
            holderDisplayName: { type: string, nullable: true }

    OrgAssignment:
      type: object
      properties:
        id: { type: string, format: uuid }
        positionId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        validFrom: { type: string, format: date, description: "Plain date (YYYY-MM-DD), not date-time." }
        validTo: { type: string, format: date, nullable: true, description: "Plain date (YYYY-MM-DD), not date-time." }

    OrgGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        source: { type: string }
        externalRef: { type: string, nullable: true }
        isActive: { type: boolean }
        isKibanManaged: { type: boolean }

    OrgGroupWithMemberCount:
      allOf:
        - $ref: "#/components/schemas/OrgGroup"
        - type: object
          properties:
            memberCount: { type: integer }

    OrgGroupMember:
      type: object
      properties:
        groupId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        addedBy: { type: string }
        addedAt: { type: string, format: date-time }
        memberDisplayName: { type: string }
        memberEmail: { type: string, nullable: true }

  responses:
    BadRequest:
      description: BAD_REQUEST / VALIDATION_ERROR
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: AUTH_TOKEN_MISSING / AUTH_TOKEN_INVALID
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: FORBIDDEN / AUTHORIZATION_DENIED / PLATFORM_ROLE_REQUIRED (RequireSuperadmin denial)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: CONFLICT (e.g. disabling a mandatory module, revoking the last superadmin)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ModuleNotInstalled:
      description: >
        MODULE_NOT_INSTALLED, the module's installation row has `installed=false`; enable is
        refused and nothing is written (no fragment activation, no default grants, no audit row).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ValidationFailed:
      description: VALIDATION_FAILED, a domain-policy rejection distinct from ordinary field-shape validation
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    GroupExternallyManaged:
      description: >
        GROUP_EXTERNALLY_MANAGED, the group's `source` is not "kiban"; membership is read-only
        through every human/API path (the single-writer-by-provenance
        invariant, enforced in org's STORE layer, not only the HTTP handler).
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AuthorizationUnavailable:
      description: >
        AUTHORIZATION_UNAVAILABLE, authz (or another required dependency) could not be reached;
        fail-closed, never a stale allow.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
