# Isolated test-stack override. Same images/services as compose.yaml; `make
# test-stack-up` brings this up as its own compose PROJECT (`docker compose -p kiban-test`,
# `-f infra/compose.yaml -f infra/compose.test.yaml --env-file .env.test`) so it never
# touches the `kiban` project's (`make dev`/`make public-up`) containers, volumes, or data.
#
# Host-published ports: compose.yaml's gateway ports are env-var-driven
# (KIBAN_GATEWAY_TLS_HOST_PORT/KIBAN_GATEWAY_HTTP_HOST_PORT, default 8443/8090) specifically so
# this override doesn't need to touch `ports:` itself — docker compose merges list-typed keys
# like `ports:` by CONCATENATION, not replacement, so an override here would publish a SECOND
# port mapping alongside compose.yaml's default 8443/8090 rather than remapping it, which would
# collide with the `kiban` project's own gateway. `.env.test`
# (generated by `make test-stack-up`) sets those two vars, plus POSTGRES_HOST_PORT/
# KEYCLOAK_HOST_PORT (already env-var-driven in compose.yaml), to host ports offset from the
# `kiban` project's own.
#
# Volumes: explicitly named (rather than relying on compose's project-name auto-prefixing of
# compose.yaml's unnamed volumes) so isolation from the `kiban` project's kiban-pgdata/
# kiban-gateway-tls/kiban-bootstrap-secrets is self-evident from this file, not just an implicit
# side effect of the `-p kiban-test` flag.
volumes:
  kiban-pgdata:
    name: kiban-test-pgdata
  kiban-gateway-tls:
    name: kiban-test-gateway-tls
  kiban-bootstrap-secrets:
    name: kiban-test-bootstrap-secrets
