# Kustomize base — see ../README.md "Why Kustomize, not Helm" for the tooling
# rationale. `namespace: kiban` applies to every resource below with no per-file repetition.
# The nine app services (registry … gateway) are directories, not files: each is `template/`
# (one Deployment+Service shape) plus a kustomization that patches in that service's name, image,
# port and env. `kubectl kustomize base/registry` renders any one of them on its own.
#
# The base carries NO Secret: it is a pure, referenceable manifest set, usable as a remote base
# (`github.com/rosschiu/kiban//deploy/k8s/base?ref=v0.1.1`) from an overlay in another
# repository. The `kiban-secrets` Secret comes from the overlay — the shipped ones list a
# gitignored `secret.yaml` written by ../gen-secrets.sh <overlay>; a remote overlay supplies its
# own (vault, sealed-secrets, ...). Every workload below mounts or reads `kiban-secrets` by name,
# so an overlay without it fails at pod start, never silently.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kiban
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - keycloak.yaml
  - jobs.yaml
  - registry
  - identity
  - org
  - authz
  # Sample modules (examples, off by default): add notification, timesheet, docs, helpdesk here
  # and to KIBAN_INSTALLED_MODULES in configmap.yaml to run them.
  - gateway
  - ingress.yaml
