# Kustomize base — see ../README.md "Why Kustomize, not Helm" for the tooling
# rationale. `namespace: kiban` applies to every resource below with no per-file repetition.
# The nine app services (registry … gateway) are directories, not files: each is `template/`
# (one Deployment+Service shape) plus a kustomization that patches in that service's name, image,
# port and env. `kubectl kustomize base/registry` renders any one of them on its own.
#
# `secret.yaml` is gitignored (generated by ../gen-secrets.sh, write-once — see
# secret.example.yaml's header) and therefore ABSENT from a fresh checkout: run
# `../gen-secrets.sh` before the first `kubectl apply -k` against this base, or `kubectl apply -k`
# fails with "no such file" on this line, by design (fail loudly, never silently deploy with
# missing secrets).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kiban
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - keycloak.yaml
  - jobs.yaml
  - registry
  - identity
  - org
  - authz
  - notification
  - timesheet
  - docs
  - helpdesk
  - gateway
  - ingress.yaml
