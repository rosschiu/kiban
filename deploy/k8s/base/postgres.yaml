# postgres:18-alpine as a single-replica StatefulSet (stable network identity + a
# PVC via volumeClaimTemplates — the K8s-native shape for the ONE stateful piece of this stack;
# every other service is a plain Deployment). Mirrors infra/compose.yaml's `postgres` service:
# same image, same POSTGRES_USER/PASSWORD/DB env contract, same keycloak-DB init (ConfigMap here
# instead of a bind-mounted file — base/configmap.yaml's `kiban-postgres-init`).
#
# Resources measured, not guessed: `docker stats` against the running kiban-test compose stack
# showed postgres idle at ~112MiB RSS / <5% CPU with a small demo-seed dataset.
# Requests give it a safe idle floor; limits give headroom for the demo-reset restore/vandalize
# cycle (pg_dump/pg_restore, real query load) without being unbounded.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kiban
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: kiban
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: kiban-config, key: POSTGRES_USER } }
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: kiban-config, key: POSTGRES_DB } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: kiban-secrets, key: POSTGRES_PASSWORD } }
            # Read by the initdb scripts (kiban-postgres-init) only.
            - name: KIBAN_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: kiban-secrets, key: KIBAN_DB_PASSWORD } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: kiban-secrets, key: KC_DB_PASSWORD } }
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-init
          configMap:
            name: kiban-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName set here on purpose — overlays/production patches one in (a real
        # cluster's default is rarely what you want for a database volume); kind's own default
        # `standard` StorageClass (dynamic host-path provisioner) picks one up unpatched.
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kiban
spec:
  clusterIP: None # headless — StatefulSet stable DNS (postgres-0.postgres...); postgres:5432
  # also resolves via the plain Service name, which every other manifest here uses.
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
