# The secret half of the compose env contract (.env.example /
# deploy/quickstart/.env.example), collapsed into one Secret. EXAMPLE ONLY — placeholders, never
# real credentials, committed so the field list is reviewable. The real file
# (`deploy/k8s/base/secret.yaml`, gitignored) is generated by `deploy/k8s/gen-secrets.sh`
# (write-once, same posture as `infra/setup.sh`'s own .env scaffolding) — never hand-edit
# a copy of this file with real values into git.
#
# Three fields are consumed as mounted FILES, never env (the "never a plain env var" rule
# infra/compose.yaml applies, ported to Secret volume mounts): superadmin-password and
# KC_BOOTSTRAP_ADMIN_PASSWORD by `bootstrap` (base/jobs.yaml, *_FILE env vars), and
# KEYCLOAK_IDENTITY_CLIENT_SECRET by `identity` (base/identity/kustomization.yaml). The keycloak
# Deployment itself still takes both Keycloak secrets as env (Keycloak has no file option).
apiVersion: v1
kind: Secret
metadata:
  name: kiban-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  KIBAN_DB_PASSWORD: "REPLACE_ME"
  KC_DB_PASSWORD: "REPLACE_ME"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "REPLACE_ME"
  KEYCLOAK_IDENTITY_CLIENT_SECRET: "REPLACE_ME"
  KIBAN_REGISTRY_DB_PASSWORD: "REPLACE_ME"
  KIBAN_IDENTITY_DB_PASSWORD: "REPLACE_ME"
  KIBAN_ORG_DB_PASSWORD: "REPLACE_ME"
  KIBAN_AUTHZ_DB_PASSWORD: "REPLACE_ME"
  KIBAN_NOTIFICATION_DB_PASSWORD: "REPLACE_ME"
  KIBAN_TIMESHEET_DB_PASSWORD: "REPLACE_ME"
  KIBAN_DOCS_DB_PASSWORD: "REPLACE_ME"
  KIBAN_HELPDESK_DB_PASSWORD: "REPLACE_ME"
  KIBAN_NOTIFICATION_WEBHOOK_HMAC_SECRET: "REPLACE_ME"
  # Mounted as a file, not read via envFrom — see header.
  superadmin-password: "REPLACE_ME"
