# The non-secret half of the compose env contract (infra/compose.yaml,
# deploy/quickstart/docker-compose.yml), collapsed into one ConfigMap consumed via `envFrom` by
# every Deployment/Job below — mirrors .env's own non-secret fields. Values here are the
# kind-proof defaults; overlays/production patches KIBAN_GATEWAY_ORIGIN/KIBAN_DOMAIN for a real
# domain (see README.md "Production notes").
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiban-config
data:
  # The cluster superuser (initdb scripts only — see .env.example); the app DB's owner is
  # the `kiban` role those scripts create.
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "kiban"
  KEYCLOAK_REALM: "kiban"
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KIBAN_SUPERADMIN_USERNAME: "superadmin"
  KIBAN_SUPERADMIN_EMAIL: "superadmin@kiban.local"
  # The sample modules are examples, off by default (their Deployments are not in the base
  # kustomization either); name them here and add their directories to bring them up.
  KIBAN_INSTALLED_MODULES: ""
  # Confidential service clients for backends beside Kiban, and extra origins / native redirect
  # URIs for kiban-frontend (infra/compose.yaml's comments apply unchanged).
  KIBAN_SERVICE_CLIENTS: ""
  KIBAN_EXTRA_ORIGINS: ""
  # Access-token lifetime in seconds (infra/compose.yaml's comment applies unchanged).
  KIBAN_ACCESS_TOKEN_LIFESPAN: "300"
  # infra/compose.yaml's KIBAN_DOMAIN comment (`bootstrap` service) applies unchanged
  # here: leave unset for a kind proof (RealmStep falls back to its dev-loopback redirect
  # allowlist) and set to the real hostname in overlays/production once one exists.
  KIBAN_DOMAIN: ""
  # The origin every token-verifying service compares a JWT's `iss` claim against.
  # This MUST be the origin Keycloak actually derives its self-referencing issuer URL from
  # (KC_HOSTNAME_STRICT=false — see infra/compose.yaml's KEYCLOAK_ISSUER_URL comment), which is
  # whatever `Host` header the request that hit the gateway's `/auth/*` proxy carried. The kind
  # port-forward's OWN origin (`localhost:8090`) only works for a host-side caller: an in-cluster
  # Pod such as the demo-reset runner reaches the gateway via its Service DNS name
  # (`Host: gateway:8090`), gets a token with a different issuer, and every service 401s it. The
  # in-cluster Service DNS name is the one address BOTH a real in-cluster caller (the demo-reset
  # CronJob, any other in-cluster job) and a host-side caller can agree on — a host-side caller
  # just adds `-H "Host: gateway:8090"` to its port-forwarded curl calls. overlays/production overrides this to the
  # real HTTPS domain, which every caller (browser via Ingress, in-cluster jobs) reaches through
  # uniformly, so this whole workaround is kind-only.
  KIBAN_GATEWAY_ORIGIN: "http://gateway:8090"
  KEYCLOAK_ISSUER_URL: "http://gateway:8090/realms/kiban"
---
# Mirrors infra/postgres-init/01-roles.sh (deploy/quickstart/docker-compose.yml's own `configs:` block
# already established this same inlining pattern for a from-images deployment with no repo
# checkout to mount the file from). A ConfigMap mount is not executable, so the image entrypoint
# sources these; KC_DB_PASSWORD/KIBAN_DB_PASSWORD come from the postgres StatefulSet's env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kiban-postgres-init
data:
  01-roles.sh: |
    #!/bin/bash
    # SPDX-License-Identifier: Apache-2.0
    # Runs once at initdb (docker-entrypoint-initdb.d) as POSTGRES_USER, the cluster superuser —
    # the ONLY place it is used. Two roles, two databases:
    #
    # `keycloak`: a dedicated role + database, separate from the application database. Keycloak
    # connects as it (KC_DB_USERNAME/KC_DB_PASSWORD in infra/compose.yaml), owns nothing but its own
    # database and cannot connect to the app DB.
    #
    # `kiban`: the non-superuser owner of the application database (POSTGRES_DB, created by the
    # image for the superuser and handed over here). Every migration (`AUTHORIZATION kiban` in
    # migrations/*/, tern.conf's `user = kiban`), the role-password step and cmd/bootstrap connect
    # as it. CREATEROLE covers migrations/registry/*_role.sql's CREATE ROLE (PG16+: the creator gets
    # ADMIN OPTION on those roles, which is what ALTER ROLE ... PASSWORD needs); owning the database
    # covers CREATE SCHEMA, GRANT CONNECT and the trusted extensions (pgcrypto, btree_gist). No
    # CREATEDB, no BYPASSRLS, no superuser. Only `kiban` and the roles migrations GRANT CONNECT to
    # may connect (`keycloak` cannot). A cluster created before this script existed has `kiban` as
    # its bootstrap superuser, which cannot be demoted — recreate it (see the Operating page of the
    # documentation).
    #
    # No `set -e`: a ConfigMap mount (deploy/k8s) is sourced into the image entrypoint, not
    # executed; ON_ERROR_STOP + the entrypoint's own -e fail it either way.
    : "${KC_DB_PASSWORD:?KC_DB_PASSWORD not set}"
    : "${KIBAN_DB_PASSWORD:?KIBAN_DB_PASSWORD not set}"
    # The database name is fixed: shipped, checksum-frozen migrations (migrations/registry/
    # 0001/0005/0008/0010/0012) `GRANT CONNECT ON DATABASE kiban` by literal and run first on a fresh
    # cluster, so any other POSTGRES_DB fails at `migrate`. Fail here instead, at first start.
    [ "$POSTGRES_DB" = kiban ] || { echo "POSTGRES_DB must be 'kiban' (got '$POSTGRES_DB'): the shipped migrations name the database by literal — see the Operating page of the documentation" >&2; exit 1; }
    psql -v ON_ERROR_STOP=1 -v kcpw="$KC_DB_PASSWORD" -v pw="$KIBAN_DB_PASSWORD" -v db="$POSTGRES_DB" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<'SQL'
    CREATE ROLE keycloak LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD :'kcpw';
    CREATE DATABASE keycloak OWNER keycloak;
    REVOKE CONNECT ON DATABASE keycloak FROM PUBLIC;
    CREATE ROLE kiban LOGIN NOSUPERUSER NOCREATEDB CREATEROLE NOBYPASSRLS PASSWORD :'pw';
    ALTER DATABASE :"db" OWNER TO kiban;
    REVOKE CONNECT ON DATABASE :"db" FROM PUBLIC;
    GRANT CONNECT ON DATABASE :"db" TO kiban;
    SQL
