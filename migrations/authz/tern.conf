[database]
# Migrations run as the app-DB owner (kiban, infra/postgres-init/02-kiban-owner.sh) — the runtime role
# (kiban_authz) has no DDL rights. Values come from .env plus KIBAN_DB_HOST/KIBAN_DB_PORT (host-run defaults:
# 127.0.0.1/POSTGRES_HOST_PORT; the compose migrate service sets postgres/5432 — see
# infra/compose.yaml). source .env before invoking
# tern (the Makefile's migrate-authz target does this).
host = {{env "KIBAN_DB_HOST"}}
port = {{env "KIBAN_DB_PORT"}}
database = {{env "POSTGRES_DB"}}
user = kiban
password = {{env "KIBAN_DB_PASSWORD"}}
version_table = public.schema_version_authz
sslmode = disable
